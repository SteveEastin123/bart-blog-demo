<svg xmlns="http://www.w3.org/2000/svg" width="380" height="2110" viewBox="0 0 380 2110" role="img" aria-labelledby="title description">
  <title id="title">How the AI search options work</title>
  <desc id="description">Ask AI 1 translates a reader question into curated topics and keywords before finding posts. Ask AI 2 compares the question with post titles and summaries. Both methods use AI to review and rank the candidate posts.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#392d20" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d201a"/>
    </marker>
    <style>
      .page { fill: #f6f3ed; }
      .panel { fill: #fffefa; stroke: #d8cfbe; stroke-width: 2; filter: url(#shadow); }
      .box { stroke-width: 2; }
      .question { fill: #fffefa; stroke: #bcae91; }
      .terms { fill: #edf6fb; stroke: #3982a5; }
      .semantic { fill: #f5f0f7; stroke: #876f93; }
      .candidate { fill: #fff9e9; stroke: #c39a42; }
      .review { fill: #f7ece9; stroke: #9d4a42; }
      .post { fill: #edf7eb; stroke: #559657; }
      .page-heading { font: 700 29px Arial, Helvetica, sans-serif; fill: #6f1d18; }
      .page-subheading { font: 400 16px Arial, Helvetica, sans-serif; fill: #45413c; }
      .heading { font: 700 29px Arial, Helvetica, sans-serif; fill: #6f1d18; }
      .method { font: 700 11px Arial, Helvetica, sans-serif; letter-spacing: 1px; fill: #766c5f; }
      .subheading { font: 400 16px Arial, Helvetica, sans-serif; fill: #45413c; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #171512; }
      .label-small { font: 700 18px Arial, Helvetica, sans-serif; fill: #171512; }
      .detail { font: 400 15px Arial, Helvetica, sans-serif; fill: #57514a; }
      .note { font: 600 18px Arial, Helvetica, sans-serif; fill: #7d201a; }
      .arrow { fill: none; stroke: #7d201a; stroke-width: 3; marker-end: url(#arrow); }
      .accent { stroke: #7d201a; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="page" width="100%" height="100%"/>
  <text class="page-heading" x="190" y="37" text-anchor="middle">How the AI Search</text>
  <text class="page-heading" x="190" y="68" text-anchor="middle">Options Work</text>
  <text class="page-subheading" x="190" y="96" text-anchor="middle">Both begin with a reader's question or request</text>
  <text class="page-subheading" x="190" y="118" text-anchor="middle">and end with AI-ranked posts.</text>

  <rect class="panel" x="15" y="145" width="350" height="885" rx="12"/>
  <text class="heading" x="35" y="185">Ask AI 1</text>
  <line class="accent" x1="35" y1="199" x2="95" y2="199"/>
  <text class="method" x="35" y="226">CURATED VOCABULARY SEARCH</text>
  <text class="subheading" x="35" y="254">AI matches the reader's question or request</text>
  <text class="subheading" x="35" y="277">to relevant topics and keywords, which can be</text>
  <text class="subheading" x="35" y="300">reviewed or adjusted.</text>

  <rect class="box question" x="45" y="330" width="290" height="90" rx="10"/>
  <text class="label" x="190" y="385" text-anchor="middle">Question or Request</text>
  <path class="arrow" d="M190 420 L190 455"/>

  <rect class="box terms" x="45" y="455" width="290" height="90" rx="10"/>
  <text class="label-small" x="190" y="497" text-anchor="middle">AI Identifies Relevant</text>
  <text class="label-small" x="190" y="524" text-anchor="middle">Topics and Keywords</text>
  <path class="arrow" d="M190 545 L190 580"/>

  <rect class="box candidate" x="45" y="580" width="290" height="90" rx="10"/>
  <text class="label" x="190" y="635" text-anchor="middle">Matching Posts</text>
  <path class="arrow" d="M190 670 L190 705"/>

  <rect class="box terms" x="45" y="705" width="290" height="90" rx="10"/>
  <text class="label-small" x="190" y="760" text-anchor="middle">AI Reviews Candidates</text>
  <path class="arrow" d="M190 795 L190 830"/>

  <rect class="box post" x="45" y="830" width="290" height="90" rx="10"/>
  <text class="label" x="190" y="885" text-anchor="middle">Ranked Relevant Posts</text>

  <rect class="panel" x="15" y="1070" width="350" height="900" rx="12"/>
  <text class="heading" x="35" y="1125">Ask AI 2</text>
  <line class="accent" x1="35" y1="1139" x2="95" y2="1139"/>
  <text class="method" x="35" y="1166">SEMANTIC TITLE-AND-SUMMARY SEARCH</text>
  <text class="subheading" x="35" y="1194">Compares the reader's question or request</text>
  <text class="subheading" x="35" y="1217">with post titles and summaries to find</text>
  <text class="subheading" x="35" y="1240">relevant posts.</text>

  <rect class="box question" x="45" y="1270" width="290" height="90" rx="10"/>
  <text class="label" x="190" y="1325" text-anchor="middle">Question or Request</text>
  <path class="arrow" d="M190 1360 L190 1395"/>

  <rect class="box semantic" x="45" y="1395" width="290" height="90" rx="10"/>
  <text class="label-small" x="190" y="1438" text-anchor="middle">Semantic Database Search</text>
  <text class="label-small" x="190" y="1465" text-anchor="middle">Matches Titles and Summaries</text>
  <path class="arrow" d="M190 1485 L190 1520"/>

  <rect class="box candidate" x="45" y="1520" width="290" height="90" rx="10"/>
  <text class="label" x="190" y="1575" text-anchor="middle">Matching Posts</text>
  <path class="arrow" d="M190 1610 L190 1645"/>

  <rect class="box terms" x="45" y="1645" width="290" height="90" rx="10"/>
  <text class="label-small" x="190" y="1700" text-anchor="middle">AI Reviews Candidates</text>
  <path class="arrow" d="M190 1735 L190 1770"/>

  <rect class="box post" x="45" y="1770" width="290" height="90" rx="10"/>
  <text class="label" x="190" y="1825" text-anchor="middle">Ranked Relevant Posts</text>

  <text class="note" x="190" y="2024" text-anchor="middle">Both approaches are being tested.</text>
  <text class="note" x="190" y="2048" text-anchor="middle">The more relevant and accurate</text>
  <text class="note" x="190" y="2072" text-anchor="middle">method will be selected.</text>
</svg>
