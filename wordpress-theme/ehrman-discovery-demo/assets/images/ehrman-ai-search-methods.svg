<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190" role="img" aria-labelledby="title description">
  <title id="title">How the AI search options work</title>
  <desc id="description">Ask AI 1 translates a reader question into curated topics and keywords before finding posts. Ask AI 2 compares the question with post titles and summaries. Both methods use AI to review and rank the candidate posts.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#392d20" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d201a"/>
    </marker>
    <style>
      .page { fill: #f6f3ed; }
      .panel { fill: #fffefa; stroke: #d8cfbe; stroke-width: 2; filter: url(#shadow); }
      .box { stroke-width: 2; }
      .question { fill: #fffefa; stroke: #bcae91; }
      .terms { fill: #edf6fb; stroke: #3982a5; }
      .semantic { fill: #f5f0f7; stroke: #876f93; }
      .candidate { fill: #fff9e9; stroke: #c39a42; }
      .review { fill: #f7ece9; stroke: #9d4a42; }
      .post { fill: #edf7eb; stroke: #559657; }
      .page-heading { font: 700 44px Arial, Helvetica, sans-serif; fill: #6f1d18; }
      .page-subheading { font: 400 24px Arial, Helvetica, sans-serif; fill: #45413c; }
      .heading { font: 700 40px Arial, Helvetica, sans-serif; fill: #6f1d18; }
      .method { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; fill: #766c5f; }
      .subheading { font: 400 22px Arial, Helvetica, sans-serif; fill: #45413c; }
      .label { font: 700 27px Arial, Helvetica, sans-serif; fill: #171512; }
      .label-small { font: 700 24px Arial, Helvetica, sans-serif; fill: #171512; }
      .detail { font: 400 21px Arial, Helvetica, sans-serif; fill: #57514a; }
      .note { font: 600 26px Arial, Helvetica, sans-serif; fill: #7d201a; }
      .arrow { fill: none; stroke: #7d201a; stroke-width: 3; marker-end: url(#arrow); }
      .accent { stroke: #7d201a; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="page" width="100%" height="100%"/>
  <text class="page-heading" x="900" y="68" text-anchor="middle">How the AI Search Options Work</text>
  <text class="page-subheading" x="900" y="108" text-anchor="middle">Both begin with a reader's question or request and end with AI-ranked posts.</text>

  <rect class="panel" x="60" y="145" width="800" height="930" rx="16"/>
  <rect class="panel" x="940" y="145" width="800" height="930" rx="16"/>

  <text class="heading" x="105" y="215">Ask AI 1</text>
  <line class="accent" x1="105" y1="238" x2="205" y2="238"/>
  <text class="method" x="105" y="277">CURATED VOCABULARY SEARCH</text>
  <text class="subheading" x="105" y="311">AI matches the reader's question or request to relevant</text>
  <text class="subheading" x="105" y="342">topics and keywords, which can be reviewed or adjusted.</text>

  <text class="heading" x="985" y="215">Ask AI 2</text>
  <line class="accent" x1="985" y1="238" x2="1085" y2="238"/>
  <text class="method" x="985" y="277">SEMANTIC TITLE-AND-SUMMARY SEARCH</text>
  <text class="subheading" x="985" y="311">Compares the reader's question or request with post titles</text>
  <text class="subheading" x="985" y="342">and summaries to find relevant posts.</text>

  <rect class="box question" x="150" y="382" width="620" height="100" rx="12"/>
  <rect class="box question" x="1030" y="382" width="620" height="100" rx="12"/>
  <text class="label" x="460" y="442" text-anchor="middle">Question or Request</text>
  <text class="label" x="1340" y="442" text-anchor="middle">Question or Request</text>

  <path class="arrow" d="M460 482 L460 517"/>
  <path class="arrow" d="M1340 482 L1340 517"/>

  <rect class="box terms" x="150" y="517" width="620" height="100" rx="12"/>
  <text class="label" x="460" y="577" text-anchor="middle">AI Identifies Relevant Topics and Keywords</text>

  <rect class="box semantic" x="1030" y="517" width="620" height="100" rx="12"/>
  <text class="label-small" x="1340" y="562" text-anchor="middle">Semantic Database Search</text>
  <text class="label-small" x="1340" y="592" text-anchor="middle">Matches Titles and Summaries</text>

  <path class="arrow" d="M460 617 L460 652"/>
  <path class="arrow" d="M1340 617 L1340 652"/>

  <rect class="box candidate" x="150" y="652" width="620" height="100" rx="12"/>
  <rect class="box candidate" x="1030" y="652" width="620" height="100" rx="12"/>
  <text class="label" x="460" y="712" text-anchor="middle">Matching Posts</text>
  <text class="label" x="1340" y="712" text-anchor="middle">Matching Posts</text>

  <path class="arrow" d="M460 752 L460 787"/>
  <path class="arrow" d="M1340 752 L1340 787"/>

  <rect class="box terms" x="150" y="787" width="620" height="100" rx="12"/>
  <rect class="box terms" x="1030" y="787" width="620" height="100" rx="12"/>
  <text class="label" x="460" y="847" text-anchor="middle">AI Reviews Candidates</text>
  <text class="label" x="1340" y="847" text-anchor="middle">AI Reviews Candidates</text>

  <path class="arrow" d="M460 887 L460 922"/>
  <path class="arrow" d="M1340 887 L1340 922"/>

  <rect class="box post" x="150" y="922" width="620" height="100" rx="12"/>
  <rect class="box post" x="1030" y="922" width="620" height="100" rx="12"/>
  <text class="label" x="460" y="982" text-anchor="middle">Ranked Relevant Posts</text>
  <text class="label" x="1340" y="982" text-anchor="middle">Ranked Relevant Posts</text>

  <text class="note" x="900" y="1140" text-anchor="middle">Both approaches are being tested; the more relevant and accurate method will be selected.</text>
</svg>
