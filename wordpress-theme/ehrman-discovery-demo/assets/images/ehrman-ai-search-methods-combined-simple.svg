<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1190" viewBox="0 0 1800 1190" role="img" aria-labelledby="title description">
  <title id="title">Ask AI: two approaches under evaluation</title>
  <desc id="description">A shared Ask AI workflow branches into two search approaches. Ask AI 1 identifies relevant topics and keywords. Ask AI 2 uses semantic database search to match post titles and summaries. Both approaches then find matching posts, use AI to review candidates, and rank the relevant posts.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#392d20" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d201a"/>
    </marker>
    <style>
      .page { fill: #f6f3ed; }
      .panel { fill: #fffefa; stroke: #d8cfbe; stroke-width: 2; filter: url(#shadow); }
      .box { stroke-width: 2; }
      .question { fill: #fffefa; stroke: #bcae91; }
      .terms { fill: #edf6fb; stroke: #3982a5; }
      .method-one { fill: #f5f0f7; stroke: #876f93; }
      .semantic { fill: #f5f0f7; stroke: #876f93; }
      .candidate { fill: #fff9e9; stroke: #c39a42; }
      .post { fill: #edf7eb; stroke: #559657; }
      .page-heading { font: 700 44px Arial, Helvetica, sans-serif; fill: #6f1d18; }
      .page-subheading { font: 400 24px Arial, Helvetica, sans-serif; fill: #45413c; }
      .method { font: 700 27px Georgia, "Times New Roman", serif; letter-spacing: 0; fill: #6f1d18; }
      .method-number { font-size: 33px; }
      .label { font: 700 27px Arial, Helvetica, sans-serif; fill: #171512; }
      .label-small { font: 700 27px Arial, Helvetica, sans-serif; fill: #171512; }
      .note { font: 600 26px Arial, Helvetica, sans-serif; fill: #7d201a; }
      .arrow { fill: none; stroke: #7d201a; stroke-width: 3; }
      .arrow-end { marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" width="100%" height="100%"/>
  <text class="page-heading" x="900" y="68" text-anchor="middle">Ask AI: Two Approaches Under Evaluation</text>
  <text class="page-subheading" x="900" y="108" text-anchor="middle">Both begin with a reader's question or request and end with AI-ranked posts.</text>

  <rect class="panel" x="70" y="145" width="1660" height="930" rx="16"/>

  <rect class="box question" x="590" y="195" width="620" height="100" rx="12"/>
  <text class="label" x="900" y="255" text-anchor="middle">Question or Request</text>

  <path class="arrow" d="M900 295 L900 345"/>
  <path class="arrow arrow-end" d="M900 345 L460 345 L460 385"/>
  <path class="arrow arrow-end" d="M900 345 L1340 345 L1340 385"/>

  <rect class="box method-one" x="150" y="385" width="620" height="125" rx="12"/>
  <text class="method" x="460" y="421" text-anchor="middle">Ask AI <tspan class="method-number">1</tspan></text>
  <text class="label-small" x="460" y="454" text-anchor="middle">Uses Topics and Keywords</text>
  <text class="label-small" x="460" y="486" text-anchor="middle">to Find Relevant Posts</text>

  <rect class="box semantic" x="1030" y="385" width="620" height="125" rx="12"/>
  <text class="method" x="1340" y="421" text-anchor="middle">Ask AI <tspan class="method-number">2</tspan></text>
  <text class="label-small" x="1340" y="454" text-anchor="middle">Uses Semantic Search of Titles and Summaries</text>
  <text class="label-small" x="1340" y="486" text-anchor="middle">to Find Relevant Posts</text>

  <path class="arrow" d="M460 510 L460 555 L900 555"/>
  <path class="arrow" d="M1340 510 L1340 555 L900 555"/>
  <path class="arrow arrow-end" d="M900 555 L900 600"/>

  <rect class="box candidate" x="590" y="600" width="620" height="100" rx="12"/>
  <text class="label" x="900" y="660" text-anchor="middle">Candidate Posts</text>

  <path class="arrow arrow-end" d="M900 700 L900 755"/>

  <rect class="box terms" x="590" y="755" width="620" height="100" rx="12"/>
  <text class="label" x="900" y="815" text-anchor="middle">AI Reviews Titles and Summaries</text>

  <path class="arrow arrow-end" d="M900 855 L900 910"/>

  <rect class="box post" x="590" y="910" width="620" height="100" rx="12"/>
  <text class="label" x="900" y="970" text-anchor="middle">Ranked Relevant Posts</text>

  <text class="note" x="900" y="1135" text-anchor="middle">Both approaches are being tested; the one that produces the most relevant and accurate results will be selected.</text>
</svg>
