name: ehrman-wordpress-production-test

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ehrman_wordpress}
      MYSQL_USER: ${MYSQL_USER:-ehrman}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ehrman-production-test-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ehrman-root-production-test-only}
    volumes:
      - ehrman_production_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    build:
      context: ..
      dockerfile: wordpress-production/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PRODUCTION_TEST_PORT:-8086}:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-ehrman_wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-ehrman}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-ehrman-production-test-only}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-http://localhost:8086}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-ehrman-admin-production-test-only}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.test}
      EHRMAN_DISCOVERY_PARITY_TOKEN: ${EHRMAN_DISCOVERY_PARITY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EHRMAN_DISCOVERY_AI_MODEL: ${EHRMAN_DISCOVERY_AI_MODEL:-gpt-5.4-mini}
      EHRMAN_DISCOVERY_AI_TERM_STRATEGY: ${EHRMAN_DISCOVERY_AI_TERM_STRATEGY:-focused}
      EHRMAN_DISCOVERY_AI_RESULT_GROUPING: ${EHRMAN_DISCOVERY_AI_RESULT_GROUPING:-tiers}
      EHRMAN_DISCOVERY_SEMANTIC_RETRIEVAL: ${EHRMAN_DISCOVERY_SEMANTIC_RETRIEVAL:-hybrid}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'EHRMAN_DISCOVERY_IMPORT_DIR', '/opt/ehrman-import' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_DEBUG_DISPLAY', false );
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && strpos( $$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https' ) !== false ) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - ehrman_production_uploads:/var/www/html/wp-content/uploads

volumes:
  ehrman_production_mysql_data:
  ehrman_production_uploads:
