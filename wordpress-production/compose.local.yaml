name: ehrman-wordpress-mariadb-test

services:
  database:
    image: mariadb:13.0.2@sha256:f1bba652ba57bea3099ca2fe1af692af537c27d96e0bcde39dce29e2ba1ec4f3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-ehrman_wordpress}
      MARIADB_USER: ${MYSQL_USER:-ehrman}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-ehrman-production-test-only}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ehrman-root-production-test-only}
    volumes:
      - ehrman_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: ehrman-wordpress-production-test-wordpress
    build:
      context: ..
      dockerfile: wordpress-production/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PRODUCTION_TEST_PORT:-8086}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-ehrman_wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-ehrman}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-ehrman-production-test-only}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-http://localhost:8086}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-ehrman-admin-production-test-only}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.test}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EHRMAN_DISCOVERY_AI_MODEL: ${EHRMAN_DISCOVERY_AI_MODEL:-gpt-5.4-mini}
      EHRMAN_DISCOVERY_AI_RESULT_GROUPING: ${EHRMAN_DISCOVERY_AI_RESULT_GROUPING:-tiers}
      EHRMAN_INGESTION_OPENAI_API_KEY: ${EHRMAN_INGESTION_OPENAI_API_KEY:-}
      EHRMAN_INGESTION_OPENAI_MODEL: ${EHRMAN_INGESTION_OPENAI_MODEL:-gpt-5.6-sol}
      EHRMAN_INGESTION_REASONING_EFFORT: ${EHRMAN_INGESTION_REASONING_EFFORT:-high}
      EHRMAN_DISCOVERY_POST_SOURCE: ${EHRMAN_DISCOVERY_POST_SOURCE:-json}
      EHRMAN_MIGRATION_ISOLATED: ${EHRMAN_MIGRATION_ISOLATED:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        if ( getenv( 'EHRMAN_MIGRATION_ISOLATED' ) === '1' ) {
            define( 'DISABLE_WP_CRON', true );
            define( 'WP_HTTP_BLOCK_EXTERNAL', true );
        }
        define( 'EHRMAN_DISCOVERY_IMPORT_DIR', '/opt/ehrman-import' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_DEBUG_DISPLAY', false );
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && strpos( $$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https' ) !== false ) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - ehrman_mariadb_uploads:/var/www/html/wp-content/uploads

volumes:
  ehrman_mariadb_data:
  ehrman_mariadb_uploads:
