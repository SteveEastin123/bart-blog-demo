# Fresh WordPress/MariaDB demo. Keep the existing web service to retain its URL.
# Before syncing, confirm the web service name below matches the live service
# and disable Blueprint Auto Sync in Render (separate from service auto-deploy).
# Removing the old MySQL definition does NOT delete its service or disk.
services:
  - type: pserv
    name: bart-blog-demo-wordpress-mariadb
    runtime: image
    image:
      url: docker.io/library/mariadb:13.0.2@sha256:f1bba652ba57bea3099ca2fe1af692af537c27d96e0bcde39dce29e2ba1ec4f3
    # Render replaces ENTRYPOINT as well as CMD; retain database initialization.
    dockerCommand: docker-entrypoint.sh mariadbd --port=10000
    plan: starter
    region: oregon
    autoDeployTrigger: off
    envVars:
      - key: MARIADB_DATABASE
        value: ehrman_wordpress
      - key: MARIADB_USER
        value: ehrman
      - key: MARIADB_PASSWORD
        generateValue: true
      - key: MARIADB_ROOT_PASSWORD
        generateValue: true
    disk:
      name: ehrman-wordpress-mariadb-data
      mountPath: /var/lib/mysql
      sizeGB: 5

  - type: web
    name: bart-blog-demo
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./wordpress-production/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /healthz
    initialDeployHook: initialize-ehrman-wordpress
    envVars:
      - key: WORDPRESS_DB_HOST
        fromService:
          type: pserv
          name: bart-blog-demo-wordpress-mariadb
          property: hostport
      - key: WORDPRESS_DB_NAME
        fromService:
          type: pserv
          name: bart-blog-demo-wordpress-mariadb
          envVarKey: MARIADB_DATABASE
      - key: WORDPRESS_DB_USER
        fromService:
          type: pserv
          name: bart-blog-demo-wordpress-mariadb
          envVarKey: MARIADB_USER
      - key: WORDPRESS_DB_PASSWORD
        fromService:
          type: pserv
          name: bart-blog-demo-wordpress-mariadb
          envVarKey: MARIADB_PASSWORD
      - key: WORDPRESS_SITE_URL
        fromService:
          type: web
          name: bart-blog-demo
          envVarKey: RENDER_EXTERNAL_URL
      - key: WORDPRESS_ADMIN_USER
        value: ehrman-admin
      - key: WORDPRESS_ADMIN_PASSWORD
        generateValue: true
      - key: WORDPRESS_ADMIN_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EHRMAN_DISCOVERY_AI_MODEL
        value: gpt-5.4-mini
      - key: EHRMAN_DISCOVERY_AI_RESULT_GROUPING
        value: tiers
      - key: EHRMAN_INGESTION_OPENAI_MODEL
        value: gpt-5.6-sol
      - key: EHRMAN_INGESTION_REASONING_EFFORT
        value: high
      - key: EHRMAN_DISCOVERY_POST_SOURCE
        value: mysql
      - key: WORDPRESS_CONFIG_EXTRA
        value: |
          define( 'WP_ENVIRONMENT_TYPE', 'staging' );
          define( 'EHRMAN_DISCOVERY_IMPORT_DIR', '/opt/ehrman-import' );
          define( 'DISALLOW_FILE_EDIT', true );
          define( 'WP_DEBUG_DISPLAY', false );
          if ( isset( $_SERVER['HTTP_X_FORWARDED_PROTO'] ) && strpos( $_SERVER['HTTP_X_FORWARDED_PROTO'], 'https' ) !== false ) {
              $_SERVER['HTTPS'] = 'on';
          }
    disk:
      name: ehrman-wordpress-uploads
      mountPath: /var/www/html/wp-content/uploads
      sizeGB: 1
