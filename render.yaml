# Legacy Python reference deployment. The current WordPress/MySQL target is
# defined in render-wordpress.yaml.
services:
  - type: web
    name: bart-blog-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m webapp.import_data
    startCommand: gunicorn webapp.app:application --bind 0.0.0.0:$PORT
